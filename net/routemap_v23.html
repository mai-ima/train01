<style>
/* layout: 駅名標の世界観(深緑+琥珀)。左=地図(概念図/実線路図の切替)、右=駅の詳細(追従)、下=タブ(制作状況/会社/直通と系統/縦断面と区間/駅一覧) */
:root{--bg:#0e1f19;--panel:#15291f;--panel2:#10241b;--ink:#ecf2ec;--dim:#9db3a6;--line:rgba(236,242,236,.18);--accent:#f2c14e;--ok:#3fcf8e;--warn:#e5a53b;--ng:#e0635a;--info:#4aa3df;

body{background:var(--bg);color:var(--ink);font-family:var(--jp);margin:0;padding-inline:max(16px,env(safe-area-inset-left));padding-block:20px 48px}
.wrap{max-width:1360px;margin:0 auto;display:grid;gap:18px}
h1{font:700 28px/1.2 var(--jp);letter-spacing:.12em;margin:0;text-wrap:balance}
.sub{color:var(--dim);font-size:13px;letter-spacing:.06em;margin-top:6px;line-height:1.7}
.fig{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:12px;font:400 12px var(--mono);color:var(--dim);letter-spacing:.04em}
.fig b{font:500 18px var(--mono);color:var(--ink);font-variant-numeric:tabular-nums;margin-right:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sl{color:#7fd6ae}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 13px var(--jp);cursor:pointer;border-radius:3px}
.chip i{width:22px;height:6px;border-radius:3px;display:block}
.chip[aria-pressed=false]{opacity:.38}
.chip.on,.tab[aria-selected=true]{background:var(--accent);color:#0e1f19;border-color:var(--accent);font-weight:700}
.chip:focus-visible,.row:focus-visible,.tab:focus-visible,.st:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);padding:7px 10px;font:500 13px var(--jp)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
@media(max-width:1020px){.main{grid-template-columns:minmax(0,1fr)}}
@media(min-width:1180px){.wrap{max-width:1880px}.main{grid-template-columns:minmax(0,1fr) 440px}#map,#geo{min-width:0;height:calc(100vh - 130px);min-height:560px}.side{max-height:calc(100vh - 24px)}}
.mapbox{border:1px solid var(--line);background:var(--panel);overflow-x:auto}
.mapbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line)}
.seg{display:flex}.seg .chip{border-radius:0}.seg .chip:first-child{border-radius:3px 0 0 3px}.seg .chip:last-child{border-radius:0 3px 3px 0}
#map,#geo{display:block;min-width:900px;width:100%;height:auto}
#map[hidden],#geo[hidden]{display:none!important}
svg text{font-family:var(--jp);fill:var(--ink)}
.st{cursor:pointer}
.st:hover .dot,.st.sel .dot{stroke:var(--accent);stroke-width:4}
.lab{font-size:15px;font-weight:700;paint-order:stroke;stroke:var(--panel);stroke-width:4px}
.kana{font-size:10px;fill:var(--dim);paint-order:stroke;stroke:var(--panel);stroke-width:3px}
svg.sch{display:block;width:100%;max-width:380px;height:auto;min-width:0;border-radius:8px;margin:6px 0}
.box{border:1px solid var(--line);background:var(--panel);padding:16px 18px;min-width:0}
.box h2{font:700 15px var(--jp);letter-spacing:.1em;margin:0 0 10px;color:var(--accent)}
.side{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
@media(max-width:1020px){.side{position:static;max-height:none}}
#detail .hd,.hd{color:var(--accent);font-size:13px;letter-spacing:.1em}
#detail b.nm{font-size:24px;letter-spacing:.08em}
.k{font:400 11px/1.7 var(--mono);color:var(--dim);letter-spacing:.06em;margin:6px 0 0}
#detail p{margin:8px 0 0;line-height:1.7}
.tag{background:#2c4a3d;color:#e6f2ec !important;display:inline-block;margin:6px 6px 0 0;padding:2px 9px;font-size:12px;color:#0e1f19;border-radius:2px;font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px;margin:8px 0}
.kv dt{color:var(--dim)}.kv dd{margin:0;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{padding:7px 14px;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 13px var(--jp);cursor:pointer;border-radius:3px}
.panel[hidden]{display:none}
.panel{display:grid;gap:16px;padding-top:6px}
.th{display:grid;gap:12px}
.th div{border-left:4px solid var(--dim);padding-left:12px}
.th b{font-size:14px}.th small{display:block;color:var(--dim);line-height:1.65;margin-top:3px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:500 11px var(--mono);letter-spacing:.1em;color:var(--dim)}
td.n{font-variant-numeric:tabular-nums;color:var(--dim)}
tr.row{cursor:pointer}tr.row:hover{background:rgba(242,193,78,.09)}
.pill{display:inline-block;padding:1px 8px;border-radius:9px;font-size:11.5px;font-weight:700;color:#0b1712}
.cell-ok{color:var(--ok)}.cell-no{color:var(--dim)}.cell-ng{color:var(--ng)}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--dim);padding:8px 10px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:22px;height:6px;margin-right:6px;vertical-align:middle;border-radius:3px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
</style>

TABS.forEach(function(t){var b=document.createElement('button');b.className='tab';b.id='t-'+t[0];b.setAttribute('role','tab');b.setAttribute('aria-selected',t[0]==='prog'?'true':'false');b.textContent=t[1];b.onclick=function(){tab(t[0])};$('tabs').appendChild(b)});
function tab(id){TABS.forEach(function(t){$('p-'+t[0]).hidden=t[0]!==id;$('t-'+t[0]).setAttribute('aria-selected',t[0]===id?'true':'false')});try{history.replaceState(null,'','#'+id)}catch(e){}}
NET.stations.forEach(function(s){var o=document.createElement('option');o.value=s.name;$('stl').appendChild(o);var o2=document.createElement('option');o2.value=s.kana;$('stl').appendChild(o2)});
$('q').addEventListener('change',function(){var v=this.value.trim();var s=NET.stations.filter(function(x){return x.name===v||x.kana===v})[0];if(s){pick(s.id);if(view==='S')zoom(0.4,s.xy[0]+60,s.xy[1]);else{var g=GEO.stations[s.id];zoom(0.3,g.x,g.y)}}});
NET.svc.forEach(function(v){var o=document.createElement('option');o.value=v[0];o.textContent=v[2]+'：'+v[1];$('svsel').appendChild(o)});
$('svsel').addEventListener('change',function(){hl=NET.svc.filter(function(v){return v[0]===$('svsel').value})[0]||null;draw()});
$('vS').onclick=function(){setView('S')};$('vG').onclick=function(){setView('G')};
$('zin').onclick=function(){zoom(0.7)};$('zout').onclick=function(){zoom(1/0.7)};$('zrst').onclick=function(){if(view==='G'){gvb=GVB0.slice();setGVB()}else{vb=[0,30,1260,850];setVB()}};
$('tfac').onclick=function(){showFac=!showFac;this.setAttribute('aria-pressed',showFac);draw()};$('tkana').onclick=function(){showKana=!showKana;this.setAttribute('aria-pressed',showKana);draw()};
(function(){function bind(svgEl,getvb,setvb,full){var drag=null;svgEl.addEventListener('pointerdown',function(e){drag={x:e.clientX,y:e.clientY,vb:getvb().slice()}});window.addEventListener('pointerup',function(){drag=null});
 svgEl.addEventListener('pointermove',function(e){if(!drag||getvb()[2]>=full)return;var r=svgEl.getBoundingClientRect(),k=getvb()[2]/r.width;var v=getvb();setvb([drag.vb[0]-(e.clientX-drag.x)*k,drag.vb[1]-(e.clientY-drag.y)*k,v[2],v[3]])});
 svgEl.addEventListener('wheel',function(e){e.preventDefault();var r=svgEl.getBoundingClientRect(),v=getvb(),k=v[2]/r.width;zoom(e.deltaY<0?0.85:1/0.85,v[0]+(e.clientX-r.left)*k,v[1]+(e.clientY-r.top)*(v[3]/r.height))},{passive:false})}
 bind(map,function(){return vb},function(v){vb=v;setVB()},1260);bind(geo,function(){return gvb},function(v){gvb=v;setGVB()},6900)})();
showCo('JNR');draw();pick('M06');
var h0=(location.hash||'').replace('#','');if(h0==='geo'){setView('G')}else if(TABS.some(function(t){return t[0]===h0})){tab(h0)}
})();
</script>
